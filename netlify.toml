# MentorLink — Netlify deploy (Next.js 14 App Router)
# Git 연결 후 Build command / Publish directory는 Netlify가 이 파일을 읽어 자동 설정됩니다.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Netlify 대시보드 → Site configuration → Environment variables ──
# 필수:
#   NEXT_PUBLIC_SUPABASE_URL=https://YOUR_PROJECT.supabase.co
#   NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJ... (anon / publishable key)
#
# 선택:
#   OPENAI_API_KEY=...                    # AI 챗봇
#
# 결제 (포트원 V2 · 토스페이먼츠) — 값이 없으면 결제 수단이 숨겨지고 무료 멘토만 예약됩니다:
#   NEXT_PUBLIC_PORTONE_STORE_ID=store-...
#   NEXT_PUBLIC_PORTONE_CHANNEL_KEY=channel-key-...         # 국내 카드·간편결제 채널
#   NEXT_PUBLIC_PORTONE_CHANNEL_KEY_GLOBAL=channel-key-...  # (선택) 해외 발급 카드 채널
#   NEXT_PUBLIC_PORTONE_TEST_MODE=1                         # 테스트 채널일 때 "테스트 결제" 배지 표시
#   PORTONE_API_SECRET=...                                  # 포트원 콘솔 → 연동 정보 → V2 API Secret
#   PORTONE_WEBHOOK_SECRET=whsec_...                        # 포트원 콘솔 → 웹훅 (URL: /api/payments/webhook)
#   PAYMENT_HOOK_SECRET=...                                 # Supabase private.app_config 의 payment_hook_secret 값
#
# ── Supabase Dashboard → Authentication → URL Configuration ──
#   Site URL:        https://ezkv5.netlify.app
#   Redirect URLs:   https://ezkv5.netlify.app/**
#                    http://localhost:3000/**
#
# ── Supabase SQL (아직 안 했다면 Dashboard → SQL → New query) ──
#   supabase/schema.sql 전체 실행
